name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Tests & Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" 
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      DB_SSL: "false"
      JWT_SECRET: ci_test_jwt_secret_key_1234567890
      JWT_EXPIRES_IN: 1d
      JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_key_1234567890
      JWT_REFRESH_EXPIRES_IN: 7d

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Backend Dependencies
        run: npm ci

      - name: Wait for Postgres Readiness
        run: |
          for i in {1..15}; do
            pg_isready -h 127.0.0.1 -p 5432 && break || sleep 2;
          done

      - name: Run Database Initializer (Enforce strict migration)
        run: npm run db:init

      - name: Seed Test Database
        run: npm run db:seed:test

      - name: Run Backend Tests
        run: npm test

  frontend-build:
    name: Frontend Build & Compilation Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Verify Frontend Production Build
        run: npm run build
