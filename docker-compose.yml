version: "3.9"

services:

  backend:

    build: .

    container_name: dizitaladda-crm-backend

    restart: always

    ports:
      - "5000:5000"

    env_file:
      - .env

    depends_on:
      - postgres

    volumes:
      - .:/app
      - /app/node_modules

  postgres:

    image: postgres:16

    container_name: dizitaladda-crm-db

    restart: always

    environment:

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

      POSTGRES_DB: dizitaladda_crm

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/iem_lms.sql:/docker-entrypoint-initdb.d/01-iem_lms.sql:ro

volumes:

  postgres_data:
