services:
  - type: web
    name: dizitaladda-crm-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_POOL_MAX
        value: "5"
      - key: CLIENT_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://www.nidads.com,https://www.nigape.com,http://localhost:3000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: AUTH_ALLOW_BEARER
        value: "false"
